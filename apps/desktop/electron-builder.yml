appId: com.mediconnect.desktop
productName: MediConnect
directories:
  output: dist/installer
  buildResources: build
files:
  - src/main/**/*
  - src/preload.js
  - dist/renderer/**/*
  - node_modules/**/*
  - "!node_modules/.cache"
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
mac:
  target: dmg
  icon: build/icon.icns
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  installerLanguages: [ar, en]
publish:
  provider: github
  releaseType: release
